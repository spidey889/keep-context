[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keep-context"
version = "0.1.0"
description = "Read your Google Keep notes from ChatGPT through a private MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp[cli]>=1.30,<2",
  "gkeepapi==0.17.1",
  "gpsoauth==2.0.0",
  "cryptography>=46,<51",
  "keyring>=25,<26",
]

[project.scripts]
keep-context = "keep_context.cli:main"
keep-context-hosted = "keep_context.hosted:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
