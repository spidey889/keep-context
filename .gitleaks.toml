# Chrome's public manifest key stabilizes the preview ID. It cannot sign releases.
# Allow only this exact public value on this field/path; retain all secret rules.
[extend]
useDefault = true

[[allowlists]]
description = "Reviewed public Chrome manifest key"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^extension/manifest\.json$''']
